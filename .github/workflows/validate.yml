name: validate
on:
  pull_request:
  push:
    branches: [main]
    paths: ["publisher/**", "tests/**", "queue/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Validate queued drafts
        run: python -m publisher.validate
