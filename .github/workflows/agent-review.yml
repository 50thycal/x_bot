name: agent-review
# Fallback B: Weekly Review through the xAI API. Creates "Weekly review — DATE" and, with evidence, a playbook PR.
# Mon 00:13 UTC = Sun 6:13 pm US Central (CST).
on:
  schedule:
    - cron: "13 0 * * 1"
  workflow_dispatch: {}
permissions:
  contents: write        # push the review/DATE branch (never main)
  pull-requests: write
  issues: write
concurrency:
  group: agent-review
  cancel-in-progress: false
jobs:
  review:
    if: vars.AGENTS_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Weekly Review
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m agents.run review
