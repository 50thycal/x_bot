name: daily
# Grok collects raw X data and commits it to data/x/. Claude (a scheduled Claude Code session, see
# docs/SETUP.md 3c) then reads it and writes the issue + drafts PR.
# 13:17 UTC = 7:17 am US Central (CST). GitHub often starts scheduled runs late; that's fine
# (drafts merged after their slot post at the next free slot).
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch: {}
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  collect:
    if: vars.AGENTS_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write          # commit data/x/ to main (raw data only, never drafts)
    concurrency:
      group: ledger-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect X data with Grok
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL }}
          XAI_SCOUT_MODEL: ${{ vars.XAI_SCOUT_MODEL }}
          XAI_SCOUT_MAX_TURNS: ${{ vars.XAI_SCOUT_MAX_TURNS }}
          COLLECT_EVERY_DAYS: ${{ vars.COLLECT_EVERY_DAYS }}
        run: python -m agents.collect
      - name: Commit data
        run: |
          git config user.name "x-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: X collect ${{ github.run_id }}"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
