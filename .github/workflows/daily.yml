name: daily
# Grok collects raw X data -> Claude picks replies, drafts posts, opens the issue + drafts PR.
# 13:17 UTC = 7:17 am US Central (CST). GitHub often starts scheduled runs late; that's fine
# (drafts merged after their slot post at the next free slot).
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch: {}
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  collect:
    if: vars.AGENTS_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write          # commit data/x/ to main (raw data only, never drafts)
    concurrency:
      group: ledger-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect X data with Grok
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL }}
          XAI_SCOUT_MODEL: ${{ vars.XAI_SCOUT_MODEL }}
          XAI_SCOUT_MAX_TURNS: ${{ vars.XAI_SCOUT_MAX_TURNS }}
          COLLECT_EVERY_DAYS: ${{ vars.COLLECT_EVERY_DAYS }}
        run: python -m agents.collect
      - name: Commit data
        run: |
          git config user.name "x-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: X collect ${{ github.run_id }}"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1

  claude:
    needs: collect
    if: always() && vars.AGENTS_ENABLED != 'false'   # still write drafts if Grok failed; it reuses the latest data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write          # push drafts/DATE branch (prompt + allowed commands never touch main)
      issues: write
      pull-requests: write
      actions: write           # dispatch validate.yml on the drafts branch
      id-token: write          # required by claude-code-action
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # include the data just committed by the collect job
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Date and labels
        id: d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "TODAY=$(date -u +%F)" >> "$GITHUB_ENV"
          gh label create engagement-queue --color 1d76db --force
          git config user.name "x-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "TODAY=${{ steps.d.outputs.today }}. Read agents/claude/daily.md and follow it exactly."
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(python -m agents.links *),Bash(python -m publisher.validate),Bash(gh issue list *),Bash(gh issue create *),Bash(gh pr list *),Bash(gh pr create *),Bash(gh workflow run validate.yml *),Bash(git status),Bash(git diff *),Bash(git log *),Bash(git checkout -b drafts/*),Bash(git add queue/*),Bash(git commit *),Bash(git push -u origin drafts/*),Bash(ls *),Bash(date *),Bash(echo *)"
