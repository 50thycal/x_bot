name: publish
# Posts approved drafts from queue/ when due. DRY RUN unless repo variable PUBLISH_ENABLED=true.
on:
  schedule:
    - cron: "7,37 * * * *"   # twice an hour, off the :00 rush
  workflow_dispatch: {}
permissions:
  contents: write        # commit ledger + archive posted drafts
  pull-requests: read    # verify each draft arrived through a merged PR
concurrency:
  group: ledger-writer
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish due drafts
        env:
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python -m publisher.publish
      - name: Commit ledger
        if: always()
        run: |
          git config user.name "x-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ledger queue
          if git diff --cached --quiet; then echo "no ledger changes"; exit 0; fi
          git commit -m "ledger: publish run ${{ github.run_id }}"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::could not push ledger - check for a double-post risk before next run"
          exit 1
